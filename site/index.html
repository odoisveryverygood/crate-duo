<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>crate · your ai foldable sampler</title>
<meta name="description" content="your ai foldable sampler. type a vibe, get a beat.">
<meta property="og:title" content="crate">
<meta property="og:description" content="your ai foldable sampler. type a vibe, get a beat.">
<meta property="og:image" content="https://crateduo.vercel.app/og.png">
<meta name="twitter:image" content="https://crateduo.vercel.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ff5300">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400&display=swap">
<style>
  :root {
    --bg: #ff5300;
    --ink: #ffffff;
    --narrow: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
    --soft: blur(.7px);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); font-family: var(--narrow); -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  /* one column, one rhythm: 16 · 28 · 32 · 44 */
  main {
    max-width: 720px; margin: 0 auto; padding-inline: 20px; padding-block: 40px;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .word { margin-bottom: 28px; }
  .shot { width: min(94vw, 980px); margin: 0 0 28px; }
  .copy { margin: 0 0 32px; }
  #waitlist { width: 100%; max-width: 440px; margin: 0; }
  footer { margin-top: 44px; }

  /* one typeface, one scale: 160 / 44 / 22 / 18 */
  .brat {
    font-family: var(--narrow); font-weight: 400;
    font-size: clamp(120px, 17vh, 210px); line-height: .74; letter-spacing: -.035em;
    filter: blur(2.2px); margin: 0; user-select: none;
  }
  .copy {
    font-size: clamp(28px, 4vh, 38px); line-height: 1.04; letter-spacing: -.015em;
    filter: var(--soft);
  }
  form { display: flex; flex-direction: column; gap: 0; align-items: stretch; }
  label.t { position: absolute; left: -9999px; }
  .note { text-align: center; }
  .row { display: flex; gap: 0; }
  input[type=email] {
    flex: 1; min-width: 0; height: 52px; padding: 0 14px; border-radius: 0; border: 2px solid #fff; border-right: 0;
    background: #fff; color: #1a1a1a; font: 400 22px var(--narrow); outline: none;
  }
  input[type=email]::placeholder { color: #8a8a8a; }
  input[type=email]:focus-visible { box-shadow: inset 0 0 0 2px #000; }
  button {
    height: 52px; padding: 0 24px; border-radius: 0; border: 2px solid #000; cursor: pointer;
    background: #000; color: #fff; font: 400 22px var(--narrow); white-space: nowrap;
  }
  button:hover { background: #1f1f1f; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .note { min-height: 22px; font-size: 18px; margin: 10px 0 0; filter: var(--soft); }
  .ask { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .ask[hidden], form[hidden] { display: none; }
  .ask p { margin: 0; font-size: clamp(24px, 3.4vh, 30px); line-height: 1.1; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 460px; }
  .chip {
    height: 44px; padding: 0 16px; border-radius: 0; border: 2px solid #fff; background: transparent; color: #fff;
    font: 400 20px var(--narrow); cursor: pointer; white-space: nowrap;
  }
  .chip:hover, .chip:focus-visible { background: #fff; color: var(--bg); outline: none; }
  .chip[aria-pressed="true"] { background: #fff; color: var(--bg); }

  figure { margin: 0; }
  figure img { width: auto; max-width: 100%; height: auto; max-height: 56vh; display: block; margin: 0 auto; }

  footer { font-size: 18px; filter: none; opacity: 1; }

  @media (max-width: 520px) {
    main { justify-content: flex-start; padding-block: 28px 32px; }
    .brat { font-size: clamp(110px, 36vw, 170px); line-height: .74; }
    .word { margin-bottom: 22px; }
    .shot { margin-bottom: 24px; }
    figure img { max-height: none; width: 100%; }
    .copy { font-size: clamp(26px, 7.4vw, 34px); margin-bottom: 24px; }
    input[type=email], button { height: 50px; font-size: 20px; }
    button { padding: 0 16px; }
    footer { margin-top: 32px; font-size: 16px; }
  }
</style>
</head>
<body>
<main>
  <div class="word"><h1 class="brat">crate.</h1></div>
  <figure class="shot">
    <img src="duo-front.png" alt="crate running on an iphone duo: a beat on the top screen, 16 pads on the bottom screen.">
  </figure>
  <p class="copy">your ai foldable sampler.<br>type a vibe, get a beat.</p>
  <form id="waitlist" novalidate>
    <label class="t" for="email">join the waitlist</label>
    <div class="row">
      <input id="email" name="email" type="email" autocomplete="email" placeholder="your email" required>
      <input class="hp" id="company" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" id="join">join waitlist</button>
    </div>
    <p class="note" id="note" role="status" aria-live="polite"></p>
  </form>
  <div class="ask" id="ask" hidden>
    <p id="ask-q">you're in. one tap: you…</p>
    <div class="chips" role="group" aria-labelledby="ask-q">
      <button type="button" class="chip" data-role="beats">make beats</button>
      <button type="button" class="chip" data-role="sing">sing</button>
      <button type="button" class="chip" data-role="dj">dj</button>
      <button type="button" class="chip" data-role="instrument">play an instrument</button>
      <button type="button" class="chip" data-role="curious">just curious</button>
    </div>
  </div>
  <footer>1st place · yc × bitrig iphone duo hackathon</footer>
</main>

<script>
  const form = document.getElementById("waitlist"), note = document.getElementById("note"),
        input = document.getElementById("email"), btn = document.getElementById("join"),
        ask = document.getElementById("ask"), askQ = document.getElementById("ask-q");
  const say = t => { note.textContent = t; };

  // where this visitor came from: ?r=xhs (or /xhs), else the referring site
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const params = new URLSearchParams(location.search);
  let source = (params.get("r") || params.get("utm_source") || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 24);
  if (source) store.set("crate_r", source);
  else {
    source = store.get("crate_r") || "";
    if (!source && document.referrer) {
      const h = new URL(document.referrer).hostname.replace(/^www\./, "");
      source = /(^|\.)(x|twitter|t)\.co(m)?$/.test(h) ? "x" : /xiaohongshu|xhslink/.test(h) ? "xhs"
             : /linkedin|lnkd/.test(h) ? "linkedin" : h.slice(0, 24);
    }
  }
  let joined = "";

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { say("that email doesn't look right."); input.focus(); return; }
    btn.disabled = true; say("");
    try {
      const r = await fetch("/api/waitlist", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, source, company: document.getElementById("company").value }),
      });
      if (!r.ok) throw new Error(r.status);
      joined = email;
      form.hidden = true; ask.hidden = false;
      ask.querySelector(".chip").focus({ preventScroll: true });
    } catch {
      say("something went wrong. try again.");
    } finally { btn.disabled = false; }
  });

  ask.addEventListener("click", async e => {
    const chip = e.target.closest(".chip");
    if (!chip || !joined) return;
    ask.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
    askQ.textContent = "thanks. see you soon.";
    try {
      await fetch("/api/waitlist", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: joined, role: chip.dataset.role }) });
    } catch {}
  });
</script>
</body>
</html>
