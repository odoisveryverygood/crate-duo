<!doctype html>
<html><head><meta charset="utf-8">
<title>CRATE · 04 SWISS</title>
<!-- Direction 04 · SWISS — no chassis. One 6-column grid runs through lid and deck (each sequencer beat sits
     exactly above a pad column). Type, hairlines and outlined squares only; one orange block: DIG. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
<style>
:root{--w:#F5F5F3;--g1:#8C8C8C;--g2:#5A5A5A;--g3:#2E2E2E;--line:#3C3C3C;--orange:#FA5B1C}
*{box-sizing:border-box;margin:0;padding:0}
html{zoom:2}
body{width:669px;height:920px;overflow:hidden;background:#000;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;color:var(--w);font-feature-settings:'tnum' 1}
.half{width:669px;height:455px;position:relative;overflow:hidden;background:#000}
.hinge{height:10px;background:#121212}
.a{position:absolute}
.lab{font:500 7.5px/1 Inter;color:var(--g1);letter-spacing:.01em}
/* lid */
.title{left:24px;top:26px;font:600 11px/1 Inter;letter-spacing:-.005em;white-space:nowrap}
.title span{font-weight:400;color:var(--g1);margin-left:10px}
.num{font:600 94px/.74 Inter;letter-spacing:-.055em;font-feature-settings:'tnum' 0}
.num i{font-style:normal;color:var(--g2)}
.rule{height:.75px;background:var(--line)}
.lane{font:500 8px/1 Inter;color:var(--g1)}
.lane.hot{color:var(--w)}
.sq{position:absolute;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;background:#3A3A3A}
.sq.on{width:11px;height:11px;margin:-5.5px 0 0 -5.5px}
.sq.on{background:var(--w);box-shadow:none}
.sq.gh{background:var(--g2);box-shadow:none;width:7px;height:7px;margin:-3.5px 0 0 -3.5px}
.inv{position:absolute;background:var(--w)}
.sq.x{background:#B5B5B5}
.sq.x.on{background:#000}
.stn{position:absolute;font:500 7px/1 Inter;color:var(--g2);transform:translateX(-50%)}
.stn.x{color:#000;font-weight:700}
.result{left:24px;font:400 14px/1.2 Inter;letter-spacing:-.01em}
.timing{left:24px;font:500 7.5px/1 Inter;color:var(--g2);white-space:nowrap}
.timing b{font-weight:500;color:var(--g1)}
.timing span{margin-right:16px}
.timing .ok{color:var(--orange);margin:0}
.prompt{display:flex;align-items:center;gap:0}
.chip{height:22px;padding:0 10px;display:flex;align-items:center;gap:6px;font:500 8px/1 Inter;box-shadow:inset 0 0 0 .75px var(--line);white-space:nowrap;color:#D8D8D8}
.chip svg{width:7px;height:7px}
/* deck */
.mode{font:500 11px/1 Inter;color:var(--g2);letter-spacing:-.005em}
.mode.on{color:var(--w)}
.mode.on:before{content:'';display:inline-block;width:6px;height:6px;background:var(--orange);margin:0 7px 1px 0}
.pad{position:absolute;box-shadow:inset 0 0 0 .75px var(--line);padding:9px 10px}
.pad .n{font:500 21px/1 Inter;letter-spacing:-.03em}
.pad .nm{position:absolute;left:10px;bottom:10px;font:500 7.5px/1 Inter;color:var(--g1);letter-spacing:.06em}
.pad.hit{background:var(--w);box-shadow:none;color:#000}
.pad.hit .nm{color:#000}
.bk{position:absolute;width:20px;height:20px;box-shadow:inset 0 0 0 .75px var(--line);display:flex;align-items:center;justify-content:center;font:600 9px/1 Inter;color:var(--g1)}
.bk.sel{background:var(--w);color:#000;box-shadow:none}
.tb{position:absolute;width:29px;height:29px;box-shadow:inset 0 0 0 .75px var(--line);display:flex;align-items:center;justify-content:center}
.tb.on{background:var(--w);box-shadow:none}
.dig{position:absolute;background:var(--orange);color:#000;padding:10px}
.dig .t{position:absolute;left:10px;bottom:10px;font:600 15px/1 Inter;letter-spacing:-.02em}
.dig .s{position:absolute;right:10px;bottom:11px;font:500 7px/1 Inter}
</style></head><body>

<section class="half lid" id="lid">
  <div class="a title">J Dilla × Jazz Hop<span>GRA PNO, G#, A#m7 – G#m9 – C# – Fm7</span></div>
</section>
<div class="hinge"></div>
<section class="half deck" id="deck"></section>

<script>
// ---- one grid for both halves: 6 columns of 95, gutter 10.2, margin 24 ----
const C=95, GU=10.2, L=24, cx=i=>L+i*(C+GU);
const lid=document.getElementById('lid'), deck=document.getElementById('deck');
const put=(el,h)=>el.insertAdjacentHTML('beforeend',h);

// hero row (numerals start on columns 1, 3, 5)
[["Tempo","bpm","100",0],["Swing","%","57",2],["Bar","of 4","4<i>.1</i>",4]].forEach(([l,u,v,c])=>{
  put(lid,`<div class="a lab" style="left:${cx(c)}px;top:58px">${l} <span style="color:#5A5A5A">${u}</span></div>`);
  put(lid,`<div class="a num" style="left:${cx(c)-3}px;top:76px">${v}</div>`);
});
put(lid,`<div class="a rule" style="left:24px;right:24px;top:158px"></div>`);

// sequencer: lane labels in column 1, one beat per pad column (2–5), loop overview in column 6
const lanes=[["Kick","X......x..x....."],["Snare","....X.......X..g"],["Hat","X.x.X.x.X.x.X.xg"],["Rim",".........x....g."],["Chop","X.....x...x..x.."],["Bass","X..x...x..x...x."]];
const NOW=2, GT=186, RP=22;
const sx=i=>cx(1+Math.floor(i/4))+ (i%4)*(C/4)+C/8;
const ry=r=>GT+r*RP;
put(lid,`<div class="inv" style="left:${sx(NOW)-C/8}px;width:${C/4}px;top:${GT-24}px;height:${5*RP+36}px"></div>`);
for(let i=0;i<16;i++) put(lid,`<div class="stn${i===NOW?' x':''}" style="left:${sx(i)}px;top:${GT-18}px">${i+1}</div>`);
lanes.forEach(([n,s],r)=>{
  put(lid,`<div class="a lane${s[NOW]!=='.'?' hot':''}" style="left:24px;top:${ry(r)-4}px">${n}</div>`);
  [...s].forEach((ch,i)=>put(lid,`<div class="sq${ch==='.'?'':(ch==='g'?' gh':' on')}${i===NOW?' x':''}" style="left:${sx(i)}px;top:${ry(r)}px"></div>`));
});

// status: one result line + one timing strip
put(lid,`<div class="a result" style="top:338px">Dusty Dilla kit + Nujabes-style piano in G#, 100 BPM</div>`);
put(lid,`<div class="a timing" style="top:361px"><span><b>JEV</b> 95 ms</span><span><b>KIT</b> 3 ms</span><span><b>SAMPLE</b> 120 ms</span><span><b>GPT</b> 4.2 s <span class="ok">✓</span></span></div>`);
// prompt row
const star=c=>`<svg viewBox="0 0 10 10"><path d="M5 0L5.99 4.01L10 5L5.99 5.99L5 10L4.01 5.99L0 5L4.01 4.01Z" fill="${c}"/></svg>`;
put(lid,`<div class="a rule" style="left:24px;right:24px;top:392px"></div>`);
put(lid,`<div class="a prompt" style="left:24px;right:24px;top:405px">
  <span style="font:500 12px/1 Inter;margin-right:8px">›</span><span style="font:400 11px/1 Inter;color:#5A5A5A">Describe a beat, a kit or a flip</span><span style="width:1.5px;height:14px;background:#F5F5F3;margin-left:3px"></span>
  <div style="margin-left:auto;display:flex;gap:5px">
   <div class="chip">Dilla × Nujabes</div><div class="chip">House kit</div><div class="chip">Vintage break</div><div class="chip">Flip it</div>
   <div class="chip" style="background:#F5F5F3;color:#000;box-shadow:none">${star('#FA5B1C')}AI perform</div></div></div>`);

// ---- deck ----
const PT=26, PH=91, PG=10.2, py=r=>PT+r*(PH+PG);
// column 1: modes as type, brand at the foot
put(deck,`<div class="a lab" style="left:24px;top:${PT}px">Mode</div>`);
["Sample","Chop","Keys","Seq","Pad FX","16 Lvl"].forEach((m,i)=>put(deck,`<div class="a mode${m==='Seq'?' on':''}" style="left:24px;top:${PT+22+i*21}px">${m}</div>`));
put(deck,`<div class="a mode" style="left:24px;top:${py(2)+4}px">Shift</div>`);
put(deck,`<div class="a" style="left:24px;top:${py(3)+PH-38}px;font:700 22px/1 Inter;letter-spacing:-.04em">Crate</div>`);
put(deck,`<div class="a lab" style="left:24px;top:${py(3)+PH-8}px">CR-16, AI sampler</div>`);
// pads on columns 2–5
const names={1:"VNYL KCK",2:"VNYL KCK",3:"WARM SNR",4:"WNKY CLP",5:"BRT HAT",6:"DRY HAT",7:"OHAT 026",8:"SOFT RIM",9:"DRY PERC",10:"DRY PERC",11:"WARM SHK",12:"BOOM CYM",13:"808 E",14:"VNYL FX",15:"PNCH VOX",16:"VNYL TEX"};
[[13,14,15,16],[9,10,11,12],[5,6,7,8],[1,2,3,4]].forEach((row,r)=>row.forEach((n,c)=>
  put(deck,`<div class="pad${n===5?' hit':''}" style="left:${cx(1+c)}px;top:${py(r)}px;width:${C}px;height:${PH}px"><div class="n">${n}</div><div class="nm">${names[n]}</div></div>`)));
// column 6: bank, level, transport, DIG
const X6=cx(5);
put(deck,`<div class="a lab" style="left:${X6}px;top:${PT}px">Bank</div>`);
["A","B","C","D"].forEach((b,i)=>put(deck,`<div class="bk${i===0?' sel':''}" style="left:${X6+i*25}px;top:${PT+16}px">${b}</div>`));
put(deck,`<div class="a lab" style="left:${X6}px;top:${py(1)}px">Level</div>`);
put(deck,`<div class="a" style="left:${X6}px;top:${py(1)+14}px;font:500 26px/1 Inter;letter-spacing:-.04em">−6<span style="font-size:9px;letter-spacing:0;color:#8C8C8C;margin-left:3px">dB</span></div>`);
// level: one hairline track, a filled run and a cap
const LY=py(1)+64, LV=0.72*C;
put(deck,`<div class="a" style="left:${X6}px;top:${LY}px;width:${C}px;height:.75px;background:#3C3C3C"></div>`);
put(deck,`<div class="a" style="left:${X6}px;top:${LY-1.1}px;width:${LV}px;height:3px;background:#F5F5F3"></div>`);
put(deck,`<div class="a" style="left:${X6+LV-1}px;top:${LY-8}px;width:2px;height:17px;background:#F5F5F3"></div>`);
[["−∞",0],["−24",.25],["−12",.5],["−6",.72],["0",1]].forEach(([t,f])=>{
  put(deck,`<div class="a" style="left:${X6+f*C-(f===1?.75:0)}px;top:${LY+5}px;width:.75px;height:4px;background:#5A5A5A"></div>`);
  put(deck,`<div class="a lab" style="left:${X6+f*C}px;top:${LY+13}px;transform:translateX(${f===0?'0':f===1?'-100%':'-50%'});font-size:6.5px;color:${t==='−6'?'#F5F5F3':'#5A5A5A'}">${t}</div>`)});
// transport on row 3
const tIcons=[`<svg width="9" height="9" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="#FA5B1C"/></svg>`,`<svg width="8" height="9" viewBox="0 0 9 10"><path d="M0 0L9 5L0 10Z" fill="#000"/></svg>`,`<svg width="8" height="8" viewBox="0 0 8 8"><rect width="8" height="8" fill="#F5F5F3"/></svg>`];
["Rec","Play","Stop"].forEach((t,i)=>{put(deck,`<div class="tb${i===1?' on':''}" style="left:${X6+i*33}px;top:${py(2)+PH-45}px">${tIcons[i]}</div>`);
  put(deck,`<div class="a lab" style="left:${X6+i*33}px;top:${py(2)+PH-8}px;color:${i===1?'#F5F5F3':'#8C8C8C'}">${t}</div>`)});
// DIG: one orange block locked to the last pad row
put(deck,`<div class="dig" style="left:${X6}px;top:${py(3)}px;width:${C}px;height:${PH}px">${star('#000').replace('<svg','<svg width="13" height="13"')}<div class="t">Dig</div><div class="s">AI</div></div>`);
</script>
</body></html>
