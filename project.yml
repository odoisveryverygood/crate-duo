name: Crate
options:
  bundleIdPrefix: com.shuhan
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.91.0
targets:
  Crate:
    type: application
    platform: iOS
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Sources
        excludes:
          - Paywall/Verification
          - Crowd/README.md
          - Paywall/README.md
          - Sampler/README.md
          - Sampler/verify.sh
          - Crowd/verify.sh
          - Paywall/verify.sh
          - Transfer/README.md
          - Transfer/Verification
      - path: Resources/Fonts
      - path: Resources/AI
      - path: Resources/Assets.xcassets
      - path: Resources/DefaultKit
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuhan.crate
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
