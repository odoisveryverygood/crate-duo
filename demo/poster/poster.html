<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@800&display=swap">
<style>
  html,body{margin:0;background:#fff}
  body{width:1080px;height:1350px;overflow:hidden;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#1d1d1f;-webkit-font-smoothing:antialiased;text-align:center;position:relative}
  .badge{position:absolute;top:84px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:14px;
    padding:14px 26px;border-radius:999px;background:#f5f5f7;font-size:24px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
  .badge i{width:12px;height:12px;border-radius:50%;background:#fa5b1c;display:block}
  h1{position:absolute;top:190px;left:0;right:0;margin:0;font-size:112px;font-weight:600;letter-spacing:-.035em;line-height:1}
  .sub{position:absolute;top:330px;left:0;right:0;margin:0;font-size:40px;color:#6e6e73;letter-spacing:-.012em}
  img{position:absolute;top:430px;left:50%;transform:translateX(-50%);width:1040px;height:auto}
  .foot{position:absolute;bottom:64px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px;font-size:24px;color:#86868b}
  .mark{font:800 28px/1 "Doto",ui-monospace,Menlo,monospace;letter-spacing:.05em;color:#1d1d1f}
  .dot{width:5px;height:5px;border-radius:50%;background:#c7c7cc}
</style></head><body>
  <div class="badge"><i></i>1st place · YC × Bitrig iPhone Duo Hackathon</div>
  <h1>Your foldable MPC.</h1>
  <p class="sub">Type a vibe, get a beat.</p>
  <img src="crate-duo.jpg" alt="">
  <div class="foot"><span class="mark">CRATE</span><span class="dot"></span><span>crateduo.vercel.app</span></div>
</body></html>
